<!-- link preview (WhatsApp / social / LMS): og.jpg = 1200×630 screenshot from the game (Playwright) -->

<style>
  :root { --bg:#0b0f18; --ink:#eef2f8; --muted:#aeb9cc; --accent:#e8643a; --oxy:#3cc4bc; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:16px/1.5 Heebo, "Segoe UI", sans-serif; overflow:hidden; }
  canvas { display:block; }
  #boot { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding:24px 16px;
    background:radial-gradient(ellipse at 50% 80%, rgba(170,70,30,.55), rgba(11,15,24,.97) 70%); }
  #boot h1 { margin:0; font-size:clamp(36px,8vw,64px); font-weight:800; line-height:1; }
  #boot p { margin:0; max-width:560px; color:var(--muted); }
  .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .btn { font:700 18px Heebo, sans-serif; border:0; border-radius:12px; padding:14px 28px; cursor:pointer; background:var(--accent); color:#fff; }
  .btn.alt { background:#16233a; border:1px solid #3a4c6a; }
  .btn:disabled { opacity:.5; cursor:wait; }
  .btn:focus-visible { outline:3px solid var(--oxy); outline-offset:3px; }
  #hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:5; background:rgba(11,15,24,.75); color:var(--muted); font-size:13px; padding:6px 14px; border-radius:999px; white-space:nowrap; pointer-events:none; }
  #cross { position:fixed; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:#fff; box-shadow:0 0 0 2px rgba(0,0,0,.4); z-index:5; display:none; }
  body.locked #cross { display:block; }
  #sub { position:fixed; bottom:56px; left:50%; transform:translateX(-50%); z-index:6; max-width:min(760px, calc(100% - 32px)); background:rgba(8,12,20,.86); color:var(--ink);
    font-size:20px; line-height:1.45; padding:10px 18px; border-radius:14px; text-align:right; pointer-events:none; }
  #task { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:6; max-width:min(620px, calc(100% - 200px)); background:rgba(10,14,22,.92); border:2px solid #FFB347; border-radius:14px; padding:8px 18px; text-align:right; pointer-events:none; color:var(--ink); }
  #task b { display:block; color:#FFB347; font-size:13px; } #task div { font-size:19px; font-weight:700; line-height:1.35; } #task small { display:block; color:#9FB0C8; font-size:13px; margin-top:2px; }
  #meter { position:fixed; top:14px; right:14px; z-index:6; background:rgba(8,12,20,.86); border-radius:12px; padding:8px 14px; min-width:150px; direction:ltr; font-weight:700; color:var(--oxy); pointer-events:none; }
  #meter b { font-size:22px; margin-left:6px; } #meter span { font-size:14px; }
  #meter .bar { height:6px; background:#2a3a55; border-radius:3px; margin-top:6px; overflow:hidden; } #meter .bar i { display:block; height:100%; background:var(--accent); }
  #meter.low { color:#e85a4f; } #meter.low .bar i { background:#e85a4f; }
  [hidden] { display:none !important; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="boot">
  <h1>פעלול אחרון</h1>
  <p>יועץ/ת הפיזיקה של אולפן פעלולים: הרכב חייב לעצור בדיוק על שפת הצוק.</p>
  <div class="row">
    <button class="btn" id="enterVR" type="button" hidden>כניסה במשקפי VR</button>
    <button class="btn alt" id="enter" type="button" disabled>טוען…</button>
  </div>
  <p id="resumeNote" hidden style="color:var(--oxy)">נמצאה שמירה. <a href="?fresh" style="color:var(--muted)">להתחיל מחדש</a></p>
  <p style="font-size:13px">במחשב: גוררים כדי להסתכל, W A S D לתזוזה, לחיצה לבחירה, מספרים לקפיצה בין תחנות.</p>
</div>
<div id="hint" hidden></div>
<div id="cross"></div>
<div id="sub" hidden></div>
<div id="task" hidden></div>
<div id="meter" hidden><span>O₂</span><b></b><div class="bar"><i style="width:100%"></i></div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
